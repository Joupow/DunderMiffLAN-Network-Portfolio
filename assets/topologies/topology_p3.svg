<svg viewBox="0 0 1180 700" xmlns="http://www.w3.org/2000/svg">
<rect x="0" y="0" width="1180" height="700" fill="#ffffff"/>
<rect x="0" y="0" width="1180" height="46" fill="#1a2332"/>
<text x="26" y="30" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="700">P3 — Intention de design</text>

<!-- ISP -->
<rect x="60" y="120" width="150" height="48" rx="8" fill="#0f172a" stroke="#0f172a" stroke-opacity="0.25"/>
<text x="135" y="142" text-anchor="middle" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700">ISP</text>
<text x="135" y="158" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5">203.0.113.1</text>

<!-- PC exterieur -->
<rect x="60" y="250" width="170" height="48" rx="8" fill="#0f172a" stroke="#0f172a" stroke-opacity="0.25"/>
<text x="145" y="272" text-anchor="middle" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700">PC-EXTERIEUR</text>
<text x="145" y="288" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5">198.51.100.10</text>
<text x="145" y="301" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5">côté Internet</text>

<!-- ASA -->
<rect x="300" y="170" width="210" height="80" rx="8" fill="#b91c1c" stroke="#0f172a" stroke-opacity="0.25"/>
<text x="405" y="208" text-anchor="middle" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700">ASA 5506-X</text>
<text x="405" y="224" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5">outside .2/30 (sec 0)</text>
<text x="405" y="237" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5">dmz .1 (50) · inside .1 (100)</text>

<line x1="210" y1="144" x2="300" y2="190" stroke="#0f172a" stroke-width="2.2"/>
<rect x="185" y="151" width="140" height="15" rx="3" fill="#ffffff" fill-opacity="0.88"/>
<text x="255" y="162" text-anchor="middle" fill="#334155" font-family="Consolas,Menlo,monospace" font-size="9.5">outside 203.0.113.0/30</text>
<line x1="230" y1="274" x2="300" y2="235" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="7 5"/>

<!-- DMZ zone -->
<rect x="560" y="90" width="420" height="150" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="574" y="110" fill="#b45309" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700">DMZ 172.16.0.0/24 · sec 50</text>
<rect x="580" y="118" width="180" height="50" rx="8" fill="#b91c1c" stroke="#0f172a" stroke-opacity="0.25"/>
<text x="670" y="141" text-anchor="middle" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700">WEB-PUBLIC .10</text>
<text x="670" y="157" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5">NAT statique → 203.0.113.2:80</text>
<text x="670" y="170" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5">ne peut pas initier de sortie</text>
<rect x="780" y="118" width="180" height="50" rx="8" fill="#b91c1c" stroke="#0f172a" stroke-opacity="0.25"/>
<text x="870" y="141" text-anchor="middle" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700">PROXY .20</text>
<text x="870" y="157" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5">sortie forcée (TCP/ICMP/DNS)</text>
<rect x="580" y="182" width="180" height="44" rx="8" fill="#7c2d12" stroke="#0f172a" stroke-opacity="0.25"/>
<text x="670" y="202" text-anchor="middle" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700">IDS-Sensor 192.168.99.20</text>
<text x="670" y="218" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5">copie SPAN uniquement (passif)</text>
<line x1="510" y1="190" x2="560" y2="150" stroke="#b91c1c" stroke-width="2.2"/>
<rect x="522" y="154" width="26" height="15" rx="3" fill="#ffffff" fill-opacity="0.88"/>
<text x="535" y="165" text-anchor="middle" fill="#334155" font-family="Consolas,Menlo,monospace" font-size="9.5">dmz</text>

<!-- HQ-Router -->
<rect x="300" y="340" width="210" height="58" rx="8" fill="#c2410c" stroke="#0f172a" stroke-opacity="0.25"/>
<text x="405" y="367" text-anchor="middle" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700">HQ-Router 2911</text>
<text x="405" y="383" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5">inside .2/30 · OSPF</text>
<text x="405" y="396" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5">default-information originate</text>
<line x1="405" y1="250" x2="405" y2="340" stroke="#b91c1c" stroke-width="2.2"/>
<rect x="332" y="279" width="146" height="15" rx="3" fill="#ffffff" fill-opacity="0.88"/>
<text x="405" y="290" text-anchor="middle" fill="#334155" font-family="Consolas,Menlo,monospace" font-size="9.5">inside 192.168.200.0/30</text>

<!-- Campus -->
<rect x="300" y="460" width="210" height="50" rx="8" fill="#1e3a5f" stroke="#0f172a" stroke-opacity="0.25"/>
<text x="405" y="483" text-anchor="middle" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700">→ Campus (P1/P2)</text>
<text x="405" y="499" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5">Cœur · DIST · VLAN</text>
<text x="405" y="512" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5">joignable via route par défaut</text>
<line x1="405" y1="398" x2="405" y2="460" stroke="#1e3a5f" stroke-width="1.6"/>

<!-- NAT box -->
<rect x="560" y="270" width="420" height="120" rx="8" fill="#f1f5f9" stroke="#b91c1c" stroke-width="1.2"/>
<text x="576" y="292" fill="#b91c1c" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700">NAT / PAT (3 règles)</text>
<text x="576" y="314" fill="#334155" font-family="Consolas,Menlo,monospace" font-size="9.5">OBJ-INSIDE-PAT   dyn.      192.168.0.0/16 → outside .2</text>
<text x="576" y="336" fill="#334155" font-family="Consolas,Menlo,monospace" font-size="9.5">OBJ-DMZ-PAT      dyn.      172.16.0.0/24 → outside .2</text>
<text x="576" y="358" fill="#334155" font-family="Consolas,Menlo,monospace" font-size="9.5">OBJ-WEB-PUBLIC   statique  .0.10 ↔ 203.0.113.2 (ACL :80)</text>

<!-- ACL box -->
<rect x="560" y="410" width="420" height="120" rx="8" fill="#f1f5f9" stroke="#b91c1c" stroke-width="1.2"/>
<text x="576" y="432" fill="#b91c1c" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700">ACL — 3 philosophies opposées</text>
<text x="576" y="454" fill="#334155" font-family="Consolas,Menlo,monospace" font-size="9.5">OUTSIDE-IN     deny par défaut; ouvre seulement :80 → WEB</text>
<text x="576" y="476" fill="#334155" font-family="Consolas,Menlo,monospace" font-size="9.5">INSIDE-PROXY   permit proxy; deny direct 80/443 · permit ip any any ✔</text>
<text x="576" y="498" fill="#334155" font-family="Consolas,Menlo,monospace" font-size="9.5">DMZ-RESTRICT   sortie PROXY seule · deny host WEB · PAS de permit any ✘</text>

<!-- Intention de design panel -->
<rect x="60" y="546" width="700" height="144" rx="8" fill="#f1f5f9" stroke="#15803d" stroke-width="1.3"/>
<text x="74" y="567" fill="#15803d" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700">Intention de design — périmètre : ASA, DMZ, NAT, filtrage</text>
<text x="74" y="587" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">• ASA 3 zones par security-level : outside 0 · dmz 50 · inside 100 (pas de remontée sans règle)</text>
<text x="74" y="603" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">• Route par défaut injectée dans OSPF (default-information originate) → le campus sort par l'ASA</text>
<text x="74" y="619" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">• NAT/PAT : PAT dyn. inside &amp; dmz → outside .2 · publication statique WEB → 203.0.113.2:80</text>
<text x="74" y="635" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">• 3 ACL : OUTSIDE-IN deny-par-défaut · INSIDE sortie forcée via proxy · DMZ aucune sortie libre</text>
<text x="74" y="651" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">• Proxy = seul chemin de sortie DMZ · IDS passif en copie SPAN (hors chemin de données)</text>
<text x="74" y="667" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">• Contrainte assumée : outside en /30, l'ASA .2 sert à la fois d'overload PAT et de publication WEB</text>
<text x="74" y="683" fill="#64748b" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="9" font-style="italic">Adressage détaillé → TECHNICAL_OVERVIEW.md · câblage réel → capture as-built (WORKFLOW.md)</text>

<!-- Legend -->
<rect x="790" y="546" width="330" height="144" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="804" y="567" fill="#1a2332" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700">Légende</text>
<rect x="804" y="580" width="13" height="13" rx="3" fill="#0f172a"/>
<text x="825" y="590" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">Internet / ISP / poste externe</text>
<rect x="804" y="602" width="13" height="13" rx="3" fill="#b91c1c"/>
<text x="825" y="612" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">ASA &amp; hôtes DMZ</text>
<rect x="804" y="624" width="13" height="13" rx="3" fill="#7c2d12"/>
<text x="825" y="634" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">IDS (SPAN passif)</text>
<rect x="804" y="646" width="13" height="13" rx="3" fill="#c2410c"/>
<text x="825" y="656" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">Routeur inside (2911)</text>
<rect x="804" y="668" width="13" height="13" rx="3" fill="#1e3a5f"/>
<text x="825" y="678" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">Campus interne (P1/P2)</text>
</svg>

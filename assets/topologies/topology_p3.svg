<text transform="matrix(1 0 0 1 74 567)" class="st31 st3 st32">Design intent | perimeter: ASA, DMZ, NAT, filtering</text>
<text transform="matrix(1 0 0 1 74 587)" class="st15 st8 st33">• ASA 3 zones by security-level: outside 0 · dmz 50 · inside 100 (no upward flow without a rule)</text>
<text transform="matrix(1 0 0 1 74 603)" class="st15 st8 st33">• Default route injected into OSPF (default-information originate) → the campus exits via the ASA</text>
<text transform="matrix(1 0 0 1 74 619)" class="st15 st8 st33">• NAT/PAT: dynamic PAT inside &amp; dmz → outside .2 · static WEB publication → 203.0.113.2:80</text>
<text transform="matrix(1 0 0 1 74 635)" class="st15 st8 st33">• 3 ACLs: OUTSIDE-IN default-deny · INSIDE forced egress via proxy · DMZ no free egress</text>
<text transform="matrix(1 0 0 1 74 651)" class="st15 st8 st33">• Proxy = only DMZ egress path · passive IDS on SPAN copy (off the data path)</text>
<text transform="matrix(1 0 0 1 74 667)" class="st15 st8 st33">• Accepted constraint: outside on /30, the ASA .2 serves both as PAT overload and WEB publication</text>

<text transform="matrix(1 0 0 1 576 432)" class="st26 st3 st27">ACL — 3 opposing philosophies</text>
<text transform="matrix(1 0 0 1 576 454)" class="st15 st16 st11">OUTSIDE-IN default deny; opens only :80 → WEB</text>
<text transform="matrix(1 0 0 1 576 476)" class="st28"><tspan x="0" y="0" class="st15 st16 st11">INSIDE-PROXY permit proxy; deny direct 80/443 · permit ip any any </tspan><tspan x="344.7" y="0" class="st15 st29 st11">✔</tspan></text>
<text transform="matrix(1 0 0 1 576 498)" class="st28"><tspan x="0" y="0" class="st15 st16 st11">DMZ-RESTRICT PROXY egress only · deny host WEB · NO permit any </tspan><tspan x="329.1" y="0" class="st15 st29 st11">✘</tspan></text>

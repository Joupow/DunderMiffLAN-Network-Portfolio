<text transform="matrix(1 0 0 1 970 120)" class="st20 st2 st18">Fabric rules (invariants)</text>
<text transform="matrix(1 0 0 1 970 136)" class="st21 st10 st14">• Each leaf connects to BOTH spines (bipartite)</text>
<text transform="matrix(1 0 0 1 970 150)" class="st21 st10 st14">• No Spine↔Spine link · no Leaf↔Leaf link</text>
<text transform="matrix(1 0 0 1 970 164)" class="st21 st10 st14">• Any inter-leaf flow transits exactly 1 spine</text>
<text transform="matrix(1 0 0 1 970 178)" class="st21 st10 st14">• Routed /30 links · OSPF P2P (no DR/BDR)</text>
<text transform="matrix(1 0 0 1 970 204)" class="st20 st2 st18">Traffic flows</text>
<text transform="matrix(1 0 0 1 970 220)" class="st21 st10 st14">• East-West: Leaf → Spine1 AND Spine2</text>
<text transform="matrix(1 0 0 1 984 233)" class="st22 st10 st23">= 2 equal-cost paths (intra-fabric ECMP)</text>
<text transform="matrix(1 0 0 1 970 249)" class="st21 st10 st14">• North-South: Servers → Border Leaf → Core</text>
<text transform="matrix(1 0 0 1 984 262)" class="st22 st10 st23">= dual exit (Border1 &amp; Border2)</text>
<text transform="matrix(1 0 0 1 970 278)" class="st21 st10 st14">• Uniform latency: 1 spine hop max</text>
<text transform="matrix(1 0 0 1 970 304)" class="st20 st2 st18">High availability</text>
<text transform="matrix(1 0 0 1 970 320)" class="st21 st10 st14">• Loss of one spine = reduced bandwidth,</text>
<text transform="matrix(1 0 0 1 984 333)" class="st22 st10 st23">no outage (ECMP recomputes)</text>
<text transform="matrix(1 0 0 1 970 349)" class="st21 st10 st14">• 2 border leafs = 2 independent campus exits</text>
<text transform="matrix(1 0 0 1 970 363)" class="st21 st10 st14">• OSPF reconvergence ~40 s (Dead timer)</text>
<text transform="matrix(1 0 0 1 970 389)" class="st20 st2 st18">OSPF (area 0)</text>
<text transform="matrix(1 0 0 1 970 405)" class="st21 st10 st14">• Full adjacencies, point-to-point type</text>
<text transform="matrix(1 0 0 1 970 419)" class="st21 st10 st14">• UNIQUE RID per device (41 → 46)</text>
<text transform="matrix(1 0 0 1 970 458)" class="st20 st2 st18">Link legend</text>

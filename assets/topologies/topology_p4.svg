<!-- ===== PANNEAU LOGIQUE (ce que la capture ne montre pas) ===== -->
<rect x="955" y="100" width="335" height="420" rx="8" fill="#f1f5f9" stroke="#15803d" stroke-width="1.3"/>

<!-- A. Règles du fabric -->
<text x="970" y="120" fill="#0f172a" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="700">Règles du fabric (invariants)</text>
<text x="970" y="136" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5">• Chaque leaf est relié aux DEUX spines (biparti)</text>
<text x="970" y="150" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5">• Aucun lien Spine↔Spine · aucun lien Leaf↔Leaf</text>
<text x="970" y="164" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5">• Tout flux inter-leaf transite par 1 seul spine</text>
<text x="970" y="178" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5">• Liens routés /30 · OSPF P2P (pas de DR/BDR)</text>

<!-- B. Flux -->
<text x="970" y="204" fill="#0f172a" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="700">Flux de trafic</text>
<text x="970" y="220" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5">• Est-Ouest : Leaf → Spine1 ET Spine2</text>
<text x="984" y="233" fill="#64748b" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="9">= 2 chemins à coût égal (ECMP intra-fabric)</text>
<text x="970" y="249" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5">• Nord-Sud : Serveurs → Border Leaf → Core</text>
<text x="984" y="262" fill="#64748b" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="9">= double sortie (Border1 &amp; Border2)</text>
<text x="970" y="278" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5">• Latence uniforme : 1 saut de spine max</text>

<!-- C. Haute dispo -->
<text x="970" y="304" fill="#0f172a" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="700">Haute disponibilité</text>
<text x="970" y="320" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5">• Perte d'un spine = bande passante réduite,</text>
<text x="984" y="333" fill="#64748b" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="9">pas de coupure (ECMP recalcule)</text>
<text x="970" y="349" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5">• 2 Border Leafs = 2 sorties campus indépend.</text>
<text x="970" y="363" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5">• Reconvergence OSPF ~40 s (Dead timer)</text>

<!-- D. OSPF -->
<text x="970" y="389" fill="#0f172a" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="700">OSPF (aire 0)</text>
<text x="970" y="405" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5">• Adjacences complètes, type point-to-point</text>
<text x="970" y="419" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5">• RID UNIQUE par équipement (41 → 46)</text>

<!-- E. Légende des liens -->
<text x="970" y="458" fill="#0f172a" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="700">Légende des liens</text>
<line x1="972" y1="470" x2="1000" y2="470" stroke="#1e3a5f" stroke-width="2.4"/>
<text x="1008" y="473" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5">uplink Border → Core (Nord-Sud)</text>
<line x1="972" y1="486" x2="1000" y2="486" stroke="#16a34a" stroke-width="1.9"/>
<text x="1008" y="489" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5">lien fabric Leaf ↔ Spine (/30, OSPF P2P)</text>
<line x1="972" y1="502" x2="1000" y2="502" stroke="#64748b" stroke-width="1.2"/>
<text x="1008" y="505" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5">accès serveur (L2, VLAN 210 / 220)</text>

</svg>

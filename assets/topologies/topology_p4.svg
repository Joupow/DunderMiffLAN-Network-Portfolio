<text x="107" y="708" text-anchor="start" fill="#b45309" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="700">Two things I noticed matching your PT</text>
<text x="107" y="726" text-anchor="start" fill="#78350f" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">⚠ Your PT screenshot shows IDENTICAL Router-IDs on both spines (42.42.42.42) and both compute leafs (44.44.44.44).</text>
<text x="107" y="741" text-anchor="start" fill="#78350f" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">   If that is the live config and not just duplicated annotation text, it is a duplicate-RID fault: OSPF picks one LSDB</text>
<text x="107" y="756" text-anchor="start" fill="#78350f" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">   owner and the twin&#x27;s LSAs are ignored → missing/flapping routes. Each device needs a UNIQUE RID (e.g. Spine1=41,</text>
<text x="107" y="771" text-anchor="start" fill="#78350f" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">   Spine2=42, Leaf1=43, Leaf2=44). Verify: show ip ospf  and  show ip ospf database (no two rows share an Adv-Router).</text>
<text x="107" y="786" text-anchor="start" fill="#78350f" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">Rule the fabric must respect (yours does): NO Spine↔Spine link, NO Leaf↔Leaf link. All traffic transits a spine.</text>

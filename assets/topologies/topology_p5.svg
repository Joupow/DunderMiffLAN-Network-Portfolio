<text x="72" y="481" text-anchor="start" fill="#78350f" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400">No ip helper-address for VLAN 30 — CME sits in VLAN 30 with the phones (direct broadcast).</text>

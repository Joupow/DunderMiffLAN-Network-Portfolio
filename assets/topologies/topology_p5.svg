<text transform="matrix(1 0 0 1 74 451)" class="st25 st2 st26">Design intent | IP telephony: CME, Option 150, QoS</text>
<text transform="matrix(1 0 0 1 74 471)" class="st20 st7 st16">• CME co-located with the HSRP active + STP root of VLAN 30 (DIST-SW1): a single voice authority</text>
<text transform="matrix(1 0 0 1 74 487)" class="st20 st7 st16">• Phone boot: DHCP → Option 150 (.254) → TFTP → SCCP (2000) — one broken link = total failure</text>
<text transform="matrix(1 0 0 1 74 503)" class="st20 st7 st16">• No ip helper for VLAN 30: the CME sits in VLAN 30 with the phones (direct broadcast)</text>
<text transform="matrix(1 0 0 1 74 519)" class="st20 st7 st16">• QoS boundary: trust DSCP only if a Cisco phone is detected (CDP) — a PC cannot spoof EF</text>
<text transform="matrix(1 0 0 1 74 535)" class="st20 st7 st16">• Port d&apos;accès : data VLAN 10 + voice VLAN 30 · Daisy-chained PC · port-security maximum 2</text>
<text transform="matrix(1 0 0 1 74 551)" class="st20 st7 st16">• Accepted limit: CME = SPOF in lab → in prod: IP on Loopback0 + ip tftp source-interface</text>

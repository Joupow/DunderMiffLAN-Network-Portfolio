<svg viewBox="0 0 1180 700" xmlns="http://www.w3.org/2000/svg">
<rect x="0" y="0" width="1180" height="700" fill="#ffffff"/>
<rect x="0" y="0" width="1180" height="46" fill="#1a2332"/>
<text x="26" y="30" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="700">P5 — Intention de design</text>

<!-- CME -->
<rect x="430" y="90" width="300" height="64" rx="8" fill="#a16207" stroke="#0f172a" stroke-opacity="0.25"/>
<text x="580" y="120" text-anchor="middle" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700">CME sur DIST-SW1</text>
<text x="580" y="136" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5">Fa0/0 = 192.168.30.254 · SCCP</text>
<text x="580" y="149" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5">HSRP actif 30 + racine · telephony-service port 2000</text>

<!-- Boot chain -->
<rect x="60" y="200" width="300" height="200" rx="8" fill="#f1f5f9" stroke="#a16207" stroke-width="1.3"/>
<text x="76" y="222" fill="#a16207" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700">Chaîne de boot du poste (1 maillon cassé = tout échoue)</text>
<rect x="80" y="234" width="260" height="22" rx="4" fill="#fef3c7"/>
<text x="90" y="250" fill="#78350f" font-family="Consolas,Menlo,monospace" font-size="10">1  DHCP Discover (VLAN 30)</text>
<line x1="210" y1="256" x2="210" y2="264" stroke="#a16207" stroke-width="1.4"/>
<rect x="80" y="264" width="260" height="22" rx="4" fill="#fef3c7"/>
<text x="90" y="280" fill="#78350f" font-family="Consolas,Menlo,monospace" font-size="10">2  Offer + Option 150 → .254</text>
<line x1="210" y1="286" x2="210" y2="294" stroke="#a16207" stroke-width="1.4"/>
<rect x="80" y="294" width="260" height="22" rx="4" fill="#fef3c7"/>
<text x="90" y="310" fill="#78350f" font-family="Consolas,Menlo,monospace" font-size="10">3  Téléchargement config TFTP</text>
<line x1="210" y1="316" x2="210" y2="324" stroke="#a16207" stroke-width="1.4"/>
<rect x="80" y="324" width="260" height="22" rx="4" fill="#fef3c7"/>
<text x="90" y="340" fill="#78350f" font-family="Consolas,Menlo,monospace" font-size="10">4  Enregistrement SCCP (port 2000)</text>
<line x1="210" y1="346" x2="210" y2="354" stroke="#a16207" stroke-width="1.4"/>
<rect x="80" y="354" width="260" height="22" rx="4" fill="#fef3c7"/>
<text x="90" y="370" fill="#78350f" font-family="Consolas,Menlo,monospace" font-size="10">5  Poste ENREGISTRÉ</text>

<!-- IP Phone -->
<rect x="560" y="240" width="260" height="58" rx="8" fill="#a16207" stroke="#0f172a" stroke-opacity="0.25"/>
<text x="690" y="267" text-anchor="middle" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700">IP Phone 7960 (ACC Fa0/5)</text>
<text x="690" y="283" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5">switchport access 10 + voice 30</text>
<text x="690" y="296" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5">DHCP .30.50-.99 · gw = VIP .30.1</text>
<line x1="580" y1="154" x2="690" y2="240" stroke="#a16207" stroke-width="2.2"/>
<rect x="598" y="181" width="74" height="15" rx="3" fill="#ffffff" fill-opacity="0.88"/>
<text x="635" y="192" text-anchor="middle" fill="#334155" font-family="Consolas,Menlo,monospace" font-size="9.5">trunk voix</text>

<!-- Daisy PC -->
<rect x="560" y="360" width="260" height="54" rx="8" fill="#475569" stroke="#0f172a" stroke-opacity="0.25"/>
<text x="690" y="385" text-anchor="middle" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700">PC en daisy-chain</text>
<text x="690" y="401" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5">données VLAN 10</text>
<text x="690" y="414" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5">port-security maximum 2</text>
<line x1="690" y1="298" x2="690" y2="360" stroke="#475569" stroke-width="1.4"/>

<!-- QoS box -->
<rect x="880" y="200" width="270" height="150" rx="8" fill="#f1f5f9" stroke="#a16207" stroke-width="1.3"/>
<text x="896" y="222" fill="#a16207" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="700">Frontière de confiance QoS</text>
<text x="896" y="248" fill="#334155" font-family="Consolas,Menlo,monospace" font-size="9.5">mls qos trust device</text>
<text x="896" y="270" fill="#334155" font-family="Consolas,Menlo,monospace" font-size="9.5">  cisco-phone   (via CDP)</text>
<text x="896" y="292" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5">trust DSCP seulement si un vrai</text>
<text x="896" y="314" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5">téléphone Cisco est détecté —</text>
<text x="896" y="336" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5">un PC ne peut pas usurper EF.</text>

<!-- Intention de design panel -->
<rect x="60" y="430" width="770" height="158" rx="8" fill="#f1f5f9" stroke="#15803d" stroke-width="1.3"/>
<text x="74" y="451" fill="#15803d" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700">Intention de design — téléphonie IP : CME, Option 150, QoS</text>
<text x="74" y="471" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">• CME co-localisé avec l'actif HSRP + racine STP du VLAN 30 (DIST-SW1) : une seule autorité voix</text>
<text x="74" y="487" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">• Boot du poste : DHCP → Option 150 (.254) → TFTP → SCCP (2000) — un maillon cassé = échec total</text>
<text x="74" y="503" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">• Pas d'ip helper pour VLAN 30 : le CME est dans le VLAN 30 avec les postes (broadcast direct)</text>
<text x="74" y="519" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">• Frontière QoS : trust DSCP seulement si téléphone Cisco détecté (CDP) — un PC ne peut usurper EF</text>
<text x="74" y="535" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">• Port d'accès : data VLAN 10 + voice VLAN 30 · PC en daisy-chain · port-security maximum 2</text>
<text x="74" y="551" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">• Limite assumée : CME = SPOF en lab → en prod : IP sur Loopback0 + ip tftp source-interface</text>
<text x="74" y="573" fill="#64748b" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="9" font-style="italic">Adressage détaillé → TECHNICAL_OVERVIEW.md · câblage réel → capture as-built (WORKFLOW.md)</text>

<!-- Legend -->
<rect x="850" y="430" width="270" height="158" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="864" y="451" fill="#1a2332" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700">Légende</text>
<rect x="864" y="466" width="13" height="13" rx="3" fill="#a16207"/>
<text x="885" y="476" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">CME &amp; téléphonie (SCCP)</text>
<rect x="864" y="488" width="13" height="13" rx="3" fill="#475569"/>
<text x="885" y="498" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">PC données (VLAN 10)</text>
<rect x="864" y="510" width="13" height="13" rx="3" fill="#fef3c7" stroke="#a16207" stroke-width="1"/>
<text x="885" y="520" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">étapes / encarts explicatifs</text>
<text x="864" y="548" fill="#64748b" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="9">VLAN 10 = données · VLAN 30 = voix</text>
<text x="864" y="563" fill="#64748b" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="9">VIP .30.1 = passerelle voix (HSRP)</text>
</svg>

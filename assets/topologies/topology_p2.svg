<!-- Intention de design panel -->
<rect x="70" y="586" width="720" height="126" rx="8" fill="#f1f5f9" stroke="#15803d" stroke-width="1.3"/>
<text x="84" y="607" fill="#15803d" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700">Intention de design — routage, redondance &amp; services</text>
<text x="84" y="627" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">• SVI migrés du Cœur → Distribution : le Cœur devient transit L3 pur</text>
<text x="84" y="643" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">• HSRP réparti : DIST1 actif {10,30} · DIST2 actif {20,99} (équilibrage, aligné STP)</text>
<text x="84" y="659" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">• OSPF aire unique · liens routés P2P (pas de DR/BDR) · RID uniques</text>
<text x="84" y="675" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">• DHCP centralisé (HQ-Router) · ip helper sur le SVI actif uniquement (anti double-relais)</text>
<text x="84" y="691" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">• Bascule « Core-first » : évite la fenêtre de duplicate-IP sur le VIP .1</text>
<text x="84" y="706" fill="#64748b" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="9" font-style="italic">Adressage détaillé → TECHNICAL_OVERVIEW.md · câblage réel → capture as-built (WORKFLOW.md)</text>


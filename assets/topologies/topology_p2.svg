<text transform="matrix(1 0 0 1 84 607)" class="st26 st3 st27">Design intent | routing, redundancy &amp; services</text>
<text transform="matrix(1 0 0 1 84 627)" class="st15 st8 st28">• SVIs migrated from Core → Distribution: the Core becomes pure L3 transit</text>
<text transform="matrix(1 0 0 1 84 643)" class="st15 st8 st28">• Split HSRP: DIST1 active {10,30} · DIST2 active {20,99} (load-sharing, STP-aligned)</text>
<text transform="matrix(1 0 0 1 84 659)" class="st15 st8 st28">• Single-area OSPF · routed P2P links (no DR/BDR) · unique RIDs</text>
<text transform="matrix(1 0 0 1 84 675)" class="st15 st8 st28">• Centralized DHCP (HQ-Router) · ip helper on the active SVI only (anti double-relay)</text>
<text transform="matrix(1 0 0 1 84 691)" class="st15 st8 st28">• “Core-first” failover: avoids the duplicate-IP window on the VIP .1</text>

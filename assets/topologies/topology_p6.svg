<text transform="matrix(1 0 0 1 134 593)" class="st29 st3 st30">Design intent — enterprise Wi-Fi: WLC, CAPWAP, SSID/VLAN, HSRPv2</text>
<text transform="matrix(1 0 0 1 134 613)" class="st14 st8 st21">• Accepted hybrid architecture: control proven by the WLC (4 APs Online) · client data via an autonomous AP</text>
<text transform="matrix(1 0 0 1 134 629)" class="st14 st8 st21">• VLAN 300 (Wi-Fi management): HSRPv2 active = DIST-SW1 (canonical) · standby = DIST-SW2 · VIP 192.168.100.1</text>
<text transform="matrix(1 0 0 1 134 645)" class="st14 st8 st21">• SSID 301 Corp / 310 Guest · WPA2/AES · DHCP VLAN 300 on DIST-SW1 (.10-.50), WLC DHCP disabled</text>
<text transform="matrix(1 0 0 1 134 661)" class="st14 st8 st21">• Accepted PT limit: PT 9.0 doesn&apos;t simulate the CAPWAP data plane → hence the autonomous AP for client traffic</text>
<text transform="matrix(1 0 0 1 134 677)" class="st14 st8 st21">• Guest isolation (VLAN 310) configured but not proven in the data plane (no captive portal in PT)</text>
<text transform="matrix(1 0 0 1 134 693)" class="st14 st8 st21">• 5 GHz ch36 dropped → the PT AP only exposes a 2.4 GHz radio (honest downgrade, tracked in the matrix)</text>

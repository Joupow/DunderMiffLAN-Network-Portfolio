<!-- Intention de design panel -->
<rect x="120" y="572" width="720" height="160" rx="8" fill="#f1f5f9" stroke="#15803d" stroke-width="1.3"/>
<text x="134" y="593" fill="#15803d" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700">Intention de design — Wi-Fi d'entreprise : WLC, CAPWAP, SSID/VLAN, HSRPv2</text>
<text x="134" y="613" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">• Architecture hybride assumée : contrôle prouvé par le WLC (4 AP Online) · données client par un AP autonome</text>
<text x="134" y="629" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">• VLAN 300 (gestion Wi-Fi) : HSRPv2 actif = DIST-SW1 (canonique) · standby = DIST-SW2 · VIP 192.168.100.1</text>
<text x="134" y="645" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">• SSID 301 Corp / 310 Guest · WPA2/AES · DHCP VLAN 300 sur DIST-SW1 (.10-.50), DHCP WLC désactivé</text>
<text x="134" y="661" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">• Limite PT assumée : PT 9.0 ne simule pas le plan de données CAPWAP → d'où l'AP autonome pour le trafic client</text>
<text x="134" y="677" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">• Isolation Guest (VLAN 310) configurée mais non prouvée en plan de données (pas de captive portal en PT)</text>
<text x="134" y="693" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">• 5 GHz ch36 abandonné → l'AP PT n'expose qu'un champ 2.4 GHz (downgrade honnête, tracé dans la matrice)</text>
<text x="134" y="715" fill="#64748b" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="9" font-style="italic">Adressage détaillé → TECHNICAL_OVERVIEW.md · câblage réel → capture as-built (WORKFLOW.md)</text>


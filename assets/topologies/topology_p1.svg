<rect x="70" y="556" width="770" height="150" rx="8" fill="#f1f5f9" stroke="#15803d" stroke-width="1.3"/>
<text x="84" y="577" fill="#15803d" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700">Intention de design — socle LAN du siège</text>
<text x="84" y="597" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">• Hiérarchie 3 niveaux : Cœur 3650 · Distribution 3560 ×2 · Accès 2960 ×4</text>
<text x="84" y="613" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">• VLAN : 10/20/30 données · 99 management · 300 réservé Wi-Fi · 998 ports inutilisés · 999 native</text>
<text x="84" y="629" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">• Trunks 802.1Q · VLAN native 999 (protège du double-tagging)</text>
<text x="84" y="645" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">• STP pré-aligné sur le futur HSRP (P2) : DIST1 racine {10,30,300} · DIST2 racine {20,99}</text>
<text x="84" y="661" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">• Accès durci : PortFast + BPDU Guard · ports inutilisés → VLAN 998 + shutdown</text>
<text x="84" y="677" fill="#334155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="10">• Routage inter-VLAN provisoire sur le Cœur → déplacé vers la Distribution en P2</text>
<text x="84" y="695" fill="#64748b" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="9" font-style="italic">Adressage détaillé → TECHNICAL_OVERVIEW.md · câblage réel → capture as-built (WORKFLOW.md)</text>


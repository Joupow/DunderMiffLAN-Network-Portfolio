<text transform="matrix(1 0 0 1 84 597)" class="st15 st8 st25">• 3-tier hierarchy: Core 3650 · Distribution 3560 ×2 · Access 2960 ×4</text>
<text transform="matrix(1 0 0 1 84 613)" class="st15 st8 st25">• VLANs: 10/20/30 data · 99 management · 300 reserved Wi-Fi · 998 unused ports · 999 native</text>
<text transform="matrix(1 0 0 1 84 629)" class="st15 st8 st25">• 802.1Q trunks · native VLAN 999 (protects against double-tagging)</text>
<text transform="matrix(1 0 0 1 84 645)" class="st15 st8 st25">• STP pre-aligned with the future HSRP (P2): DIST1 root {10,30,300} · DIST2 root {20,99}</text>
<text transform="matrix(1 0 0 1 84 661)" class="st15 st8 st25">• Hardened access: PortFast + BPDU Guard · unused ports → VLAN 998 + shutdown</text>
